<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gravix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #17100f;
      --ink-soft: #221917;
      --brand: #E24B4A;
      --text: #F7F3F2;
      --text-muted: #8A7C79;
      --line: rgba(255, 255, 255, 0.07);
    }

    html, body { width: 100%; height: 100%; }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      cursor: default;
    }

    /* Lienzo: grilla de plano + halo cálido, guiño al canvas CAD */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 0 36px 22px;
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(to right, var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(to bottom, var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(160deg, var(--ink-soft) 0%, var(--ink) 60%);
      mask-image: radial-gradient(120% 90% at 50% 38%, #000 20%, transparent 78%);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(60% 42% at 50% 30%, rgba(226, 75, 74, 0.16), transparent 70%);
    }

    .edge {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--brand) 30%, #F08A6B 55%, transparent);
      opacity: 0.9;
    }

    /* Bloque de marca */
    .brand {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(150deg, #EC6160, var(--brand) 55%, #C43A39);
      display: grid;
      place-items: center;
      box-shadow:
        0 10px 26px rgba(226, 75, 74, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      animation: markIn 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .wordmark {
      font-size: 30px;
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1;
      animation: riseIn 420ms ease 120ms both;
    }

    .wordmark em {
      font-style: normal;
      color: var(--brand);
    }

    .tagline {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      animation: riseIn 420ms ease 200ms both;
    }

    /* Pie: barra indeterminada + version real */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      animation: riseIn 420ms ease 280ms both;
    }

    .bar-track {
      position: relative;
      width: 156px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 42%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--brand), #F5A17F, transparent);
      animation: sweep 1.25s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .meta .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.5;
    }

    .version {
      font-family: ui-monospace, "JetBrains Mono", "Roboto Mono", monospace;
      color: #A6938F;
    }

    @keyframes markIn {
      from { opacity: 0; transform: translateY(8px) scale(0.88); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes sweep {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(270%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark, .wordmark, .tagline, .footer { animation: none; }
      .bar-fill { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="edge"></div>

    <div class="brand">
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M12 36 L24 12 L36 36" stroke="#fff" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M17 28 L31 28" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="24" cy="12" r="3" fill="#fff"/>
        </svg>
      </div>

      <span class="wordmark">grav<em>ix</em></span>
      <span class="tagline">CAD 2D &middot; CNC &middot; G-code</span>
    </div>

    <div class="footer">
      <div class="bar-track"><div class="bar-fill"></div></div>
      <div class="meta">
        <span>Cargando</span>
        <span class="dot"></span>
        <!-- sync-version.mjs escribe aqui la version de package.json -->
        <span class="version" data-version>v0.6.0</span>
      </div>
    </div>
  </div>
</body>
</html>
