name: prerelease

# Publica una pre-release firmada para Linux y Windows desde la rama actual,
# sin tocar la version commiteada. La version se calcula sola en el momento:
#   <base>-pre.<YYYYMMDD>.<numero de commit>   ej. 0.5.0-pre.20260912.70
#
# La fecha es la del run y el numero es `git rev-list --count HEAD`: nada de
# esto se escribe en la rama, se calcula aca y se usa para el bundle y el tag.
#
# Se dispara a mano (Actions -> prerelease -> Run workflow).
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Publicar como borrador en vez de pre-release visible
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # La version se calcula una sola vez: si cada plataforma la calculara por su
  # cuenta, dos runners que cruzan medianoche UTC producirian versiones
  # distintas para el mismo release.
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # El contador de commits necesita la historia completa.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: calc
        run: echo "version=$(node scripts/set-prerelease-version.mjs --print)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Fija en el working tree del runner la version que calculo el job
      # `version`. No se commitea: la version de la rama sigue siendo la
      # estable.
      - name: Fijar version de pre-release
        shell: bash
        run: |
          node scripts/set-prerelease-version.mjs --set '${{ needs.version.outputs.version }}'
          npm run sync:version

      # Sin clave de firma no se pueden generar los artefactos del updater:
      # el bundler aborta con "A public key has been found, but no private
      # key". Antes que fallar el run entero, se publica la pre-release sin
      # ellos. Cuando el secret exista, esto se activa solo.
      - name: Decidir artefactos de updater
        id: updater
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo 'config=--config tauri.release.conf.json' >> "$GITHUB_OUTPUT"
            echo 'updater_json=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Firma disponible: se generan artefactos de updater'
          else
            echo 'config=' >> "$GITHUB_OUTPUT"
            echo 'updater_json=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Sin TAURI_SIGNING_PRIVATE_KEY: pre-release sin updater. Ver docs/RELEASE.md'
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: gravix ${{ needs.version.outputs.version }}
          releaseBody: |
            Pre-release automática desde `${{ github.ref_name }}` (commit ${{ github.sha }}).

            No apta para producción: sin garantía de estabilidad ni de compatibilidad
            del formato de proyecto entre pre-releases.
          releaseDraft: ${{ inputs.draft }}
          prerelease: true
          includeUpdaterJson: ${{ steps.updater.outputs.updater_json }}
          args: ${{ steps.updater.outputs.config }} ${{ matrix.args }}

      # El binario suelto no es un bundle, asi que tauri-action no lo sube: se
      # adjunta aparte. Sirve para correr la app sin instalar nada, siempre que
      # el sistema ya tenga webkit2gtk y gtk3 (el AppImage los trae adentro).
      - name: Adjuntar binario suelto de Linux
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bin=$(find src-tauri/target/release -maxdepth 1 -type f -name '[Gg]ravix' -print -quit)
          if [ -z "$bin" ]; then
            echo '::error::No se encontro el binario en src-tauri/target/release'
            exit 1
          fi
          out="Gravix_${VERSION}_linux_x86_64"
          cp "$bin" "$out"
          chmod +x "$out"
          gh release upload "v${VERSION}" "$out" --clobber --repo "$GITHUB_REPOSITORY"
