name: release

# Publica un release estable firmado para Linux y Windows. Se dispara con un
# tag vX.Y.Z, que debe coincidir con la version de package.json (sync-version
# propaga esa version a tauri.conf.json y Cargo.toml en el prebuild).
#
# macOS no esta en la matriz: distribuir ahi exige cuenta de Apple Developer,
# firma y notarizacion. Cuando eso exista se agregan dos entradas mas
# (aarch64-apple-darwin y x86_64-apple-darwin) y el toolchain con esos targets.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Un release estable sin firma deja a los usuarios sin camino de
      # actualizacion, asi que aca si se corta antes de compilar.
      - name: Verificar clave de firma
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo '::error::Falta el secret TAURI_SIGNING_PRIVATE_KEY. Ver docs/RELEASE.md seccion 0.'
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'gravix ${{ github.ref_name }}'
          releaseBody: 'Ver CHANGELOG. Los binarios se adjuntan abajo.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # createUpdaterArtifacts vive en un config aparte: activarlo en la
          # config base obliga a tener la clave privada para cualquier build local.
          args: --config tauri.release.conf.json ${{ matrix.args }}

      # El binario suelto no es un bundle, asi que tauri-action no lo sube: se
      # adjunta aparte. Sirve para correr la app sin instalar nada, siempre que
      # el sistema ya tenga webkit2gtk y gtk3 (el AppImage los trae adentro).
      - name: Adjuntar binario suelto de Linux
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bin=$(find src-tauri/target/release -maxdepth 1 -type f -name '[Gg]ravix' -print -quit)
          if [ -z "$bin" ]; then
            echo '::error::No se encontro el binario en src-tauri/target/release'
            exit 1
          fi
          # El resto de los artefactos nombra la version sin la v del tag
          out="Gravix_${TAG#v}_linux_x86_64"
          cp "$bin" "$out"
          chmod +x "$out"
          gh release upload "$TAG" "$out" --clobber --repo "$GITHUB_REPOSITORY"
