name: release

# Publica un release estable firmado para Linux y Windows. Se dispara con un
# tag vX.Y.Z, que debe coincidir con la version de package.json (sync-version
# propaga esa version a tauri.conf.json y Cargo.toml en el prebuild).
#
# macOS no esta en la matriz: distribuir ahi exige cuenta de Apple Developer,
# firma y notarizacion. Cuando eso exista se agregan dos entradas mas
# (aarch64-apple-darwin y x86_64-apple-darwin) y el toolchain con esos targets.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'gravix ${{ github.ref_name }}'
          releaseBody: 'Ver CHANGELOG. Los binarios se adjuntan abajo.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # createUpdaterArtifacts vive en un config aparte: activarlo en la
          # config base obliga a tener la clave privada para cualquier build local.
          args: --config tauri.release.conf.json ${{ matrix.args }}
