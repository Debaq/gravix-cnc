[package]
name = "grbl-web-control-pro"
version = "5.0.0"
description = "GRBL Web Control Pro - CNC/Laser/Plotter/Pencil Control"
authors = ["you"]
edition = "2021"

[lib]
name = "grbl_web_control_pro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
bcrypt = "0.15"
tokio = { version = "1", features = ["full"] }
serialport = "4"
image = "0.25"
base64 = "0.22"
tauri-plugin-dialog = "2"
