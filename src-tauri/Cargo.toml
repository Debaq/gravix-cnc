[package]
name = "gravix"
version = "0.6.0"
description = "Gravix - control CNC/GRBL con CAD 2D y generacion de G-code"
authors = ["Nicolas Baier Quezada"]
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/Debaq/gravix-cnc"
publish = false

[lib]
name = "gravix_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
bcrypt = "0.15"
tokio = { version = "1", features = ["full"] }
serialport = "4"
image = "0.25"
flate2 = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures = "0.3"
mdns-sd = "0.11"
jsonwebtoken = "9"
ts-rs = "10"
tauri-plugin-updater = "2.11.0"

# Linux: el pellizco del touchpad lo maneja WebKitGTK adentro del webview, no
# llega al DOM. Para apagarlo hay que hablarle al widget directamente.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
tauri-plugin-process = "2.3.1"
